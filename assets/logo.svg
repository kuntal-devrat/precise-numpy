<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Outer Precision Interval Brackets '[' and ']' -->
  <path d="M 120 140 H 80 V 372 H 120" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <path d="M 392 140 H 432 V 372 H 392" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Array Grid Elements (3x3 SIMD Matrix Tiles) -->
  <!-- Row 1 -->
  <rect x="156" y="160" width="56" height="56" rx="12" fill="url(#indigoGrad)" opacity="0.9"/>
  <rect x="228" y="160" width="56" height="56" rx="12" fill="url(#cyanGrad)" opacity="0.9"/>
  <rect x="300" y="160" width="56" height="56" rx="12" fill="url(#indigoGrad)" opacity="0.9"/>

  <!-- Row 2 -->
  <rect x="156" y="228" width="56" height="56" rx="12" fill="url(#cyanGrad)" opacity="0.9"/>
  <rect x="228" y="228" width="56" height="56" rx="12" fill="url(#goldGrad)" filter="url(#glow)"/>
  <rect x="300" y="228" width="56" height="56" rx="12" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- Row 3 -->
  <rect x="156" y="296" width="56" height="56" rx="12" fill="url(#indigoGrad)" opacity="0.9"/>
  <rect x="228" y="296" width="56" height="56" rx="12" fill="url(#accentGrad)" opacity="0.9"/>
  <rect x="300" y="296" width="56" height="56" rx="12" fill="url(#cyanGrad)" opacity="0.9"/>

  <!-- Center Target Point -->
  <circle cx="256" cy="256" r="14" fill="#0F172A"/>
  <circle cx="256" cy="256" r="7" fill="#FFFFFF"/>

  <!-- Error Margin Bounds Axis -->
  <path d="M 256 120 V 392" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="6 6" opacity="0.5"/>
</svg>
