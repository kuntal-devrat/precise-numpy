[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "precise-numpy"
version = "1.0.0"
description = "High-performance NumPy-compatible interval arrays with guaranteed numerical error bounds"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/kuntal-devrat/precise-numpy"
Repository = "https://github.com/kuntal-devrat/precise-numpy"
Documentation = "https://github.com/kuntal-devrat/precise-numpy"


[project.optional-dependencies]
test = ["numpy>=1.24"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "precise_numpy._precise_numpy"
